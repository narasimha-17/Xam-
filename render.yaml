services:
  - type: web
    name: xamplus-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh entrypoint.sh
    # Disks require a paid plan — free-tier services can't mount one at all, and their local
    # filesystem is wiped on every deploy/restart anyway. Uploaded PDFs and discussion images
    # live under UPLOAD_DIR/DISCUSSION_IMAGE_DIR, which are pointed at this disk's mount path
    # below so they survive redeploys.
    plan: starter
    healthCheckPath: /health
    disk:
      name: xamplus-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      # Database now lives on Neon (Render's free Postgres expires/suspends after 30
      # days) — set both to the Neon connection string manually in the dashboard.
      - key: DATABASE_URL
        sync: false
      - key: SYNC_DATABASE_URL
        sync: false
      # Firebase Admin SDK service account JSON (raw JSON string) — set manually,
      # never committed. See backend/app/core/firebase.py.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads/pdfs
      - key: DISCUSSION_IMAGE_DIR
        value: /var/data/uploads/discussion_images
      - key: FEEDBACK_IMAGE_DIR
        value: /var/data/uploads/feedback_images
      # The account that becomes admin the first time it signs in via Firebase
      # (Google or email/password) — set this to an email you actually control.
      - key: SEED_ADMIN_EMAIL
        value: admin@example.com
      - key: SEED_ADMIN_NAME
        value: Admin
      - key: AI_FEATURES_ENABLED
        value: "false"
      # Set these two after the first deploy, once you know both services' URLs
      # (see the "Deploying" section in README.md) — Render can't know either
      # service's public URL until it exists.
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: xamplus-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # Set this to the backend service's URL after the first deploy (see README.md).
      - key: VITE_API_URL
        sync: false
      # Firebase web config (not secret, but set manually since these come from the
      # Firebase console). See frontend/src/lib/firebase.ts.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
